<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Sora:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><title>SOKO NEXT – Cart</title></head><body><header id="hdr"></header>
<main class="wrap"><h1 data-i18n="yourCart"></h1><div class="two" style="margin-top:1.4rem"><div id="items"></div>
<aside><div id="sum" class="glass"></div><p style="margin:1rem 0 .4rem"><input class="fld" id="pc" data-ph="promo" placeholder="SOKO10"> </p><button class="btn sm ghost" id="ap" data-i18n="apply"></button>
<p style="margin-top:1rem"><input class="fld" id="addr" data-ph="address"></p><p style="margin:.6rem 0"><select class="fld" id="pay"><option value="mpesa">M-Pesa</option><option value="tigopesa">Tigo Pesa</option><option value="airtel">Airtel Money</option><option value="card">Card (Visa/Mastercard)</option><option value="paypal">PayPal</option><option value="bank">Bank transfer</option></select></p>
<button class="btn" style="width:100%" id="co" data-i18n="checkout"></button></aside></div></main><footer id="ftr"></footer><script src="js/i18n.js"></script><script src="js/app.js"></script><script src="js/cart.js"></script><script>
document.addEventListener('DOMContentLoaded',()=>{renderCart();
 document.getElementById('ap').onclick=()=>{const v=document.getElementById('pc').value.trim().toUpperCase();if(PROMOS[v]){window.promo=v;toast(t('promoOk'))}else{window.promo='';toast(t('promoBad'),'err')}renderCart()};
 document.getElementById('co').onclick=checkout});</script></body></html>
